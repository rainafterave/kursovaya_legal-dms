global
    log stdout format raw local0

defaults
    mode http
    timeout connect 5s
    timeout client 15s
    timeout server 15s

frontend metrics_api
    bind :2375
    acl read_request method GET
    acl list_path path -m str /containers/json
    acl stats_path path_reg ^/containers/[0-9a-f]{64}/stats$
    http-request deny deny_status 403 unless read_request
    http-request deny deny_status 403 unless list_path or stats_path
    default_backend docker_engine

backend docker_engine
    server engine /var/run/docker.sock
