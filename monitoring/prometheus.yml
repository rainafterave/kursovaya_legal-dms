global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: website
    static_configs:
      - targets: ["nginx:8081"]

  - job_name: docker
    static_configs:
      - targets: ["docker-metrics:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
