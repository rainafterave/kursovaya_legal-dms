resolver 127.0.0.11 valid=10s ipv6=off;
upstream legal_app {
    zone legal_app 64k;
    # Docker DNS возвращает адреса обоих экземпляров сервиса app.
    server app:8000 resolve max_fails=1 fail_timeout=5s;
}

proxy_connect_timeout 2s;
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 2;

server {
    listen 80;
    server_name localhost;
    server_tokens off;
    client_max_body_size 26m;

    # Метрики собирает Prometheus напрямую внутри Docker-сети.
    location = /metrics {
        return 404;
    }

    location / {
        proxy_pass http://legal_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 65s;
        proxy_redirect off;
    }
}

# Один общий адрес сбора метрик с переключением между экземплярами API.
# Этот порт доступен только контейнерам; на компьютере он не опубликован.
server {
    listen 8081;
    server_name _;

    location = /metrics {
        proxy_pass http://legal_app;
        proxy_read_timeout 10s;
    }

    location / {
        return 404;
    }
}
